<!DOCTYPE html>
<html lang="es">
<head>
<meta name="description" content="[add your bin description]" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizador de Relaciones en A</title>
   <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      padding: 20px;
      color: #333;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 550px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      color: #2c3e50;
    }
    .input-section {
      background: #eef2f7;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 0.9em;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      background-color: #8e44ad;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #9b59b6;
    }
    button.secondary {
      background-color: #7f8c8d;
    }
    button.secondary:hover {
      background-color: #6c757d;
    }
    .result-box {
      margin-top: 20px;
      display: none;
    }
    .set-display {
      font-weight: bold;
      margin-bottom: 10px;
      color: #2c3e50;
    }
    .relation-display {
      font-size: 1em;
      background: #fff8e7;
      border-left: 4px solid #f39c12;
      padding: 12px;
      margin-bottom: 15px;
      word-break: break-all;
    }
    .property {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .true {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .false {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Analizador de Relaciones</h2>
  
  <div class="input-section">
    <div class="input-group">
      <label for="setInput">Conjunto A (elementos separados por comas):</label>
      <input type="text" id="setInput" value="a, b, c" placeholder="Ej: 1, 2, 3 o a, b, c, d">
    </div>
    
    <div class="btn-group">
      <button class="secondary" onclick="generarConjuntoAleatorio()">Generar Conjunto A Aleatorio</button>
      <button onclick="procesarYAnalizar()">Generar Relación R y Analizar</button>
    </div>
  </div>

  <div id="resultBox" class="result-box">
    <div id="setDisplay" class="set-display"></div>

    <h3>Relación Seleccionada (R):</h3>
    <div id="relationDisplay" class="relation-display"></div>

    <h3>Análisis de Propiedades:</h3>
    <div id="reflexiveResult" class="property"></div>
    <div id="symmetricResult" class="property"></div>
  </div>
</div>

<script>
  // Función para obtener y limpiar el conjunto A ingresado por el usuario
  function obtenerConjuntoA() {
    const rawInput = document.getElementById('setInput').value;
    // Dividir por coma, quitar espacios en blanco extras y eliminar duplicados o vacíos
    const elementos = Array.from(new Set(
      rawInput.split(',')
        .map(e => e.trim())
        .filter(e => e.length > 0)
    ));
    return elementos;
  }

  // Genera un conjunto A aleatorio de 3 a 5 elementos elegidos al azar
  function generarConjuntoAleatorio() {
    const bolsaSimbolos = ['a', 'b', 'c', 'd', 'e', 'x', 'y', 'z', '1', '2', '3', '4'];
    const tamaño = Math.floor(Math.random() * 3) + 3; // Tamaño entre 3 y 5
    
    // Mezclar elementos y tomar 'tamaño' elementos
    const seleccionados = [...bolsaSimbolos]
      .sort(() => 0.5 - Math.random())
      .slice(0, tamaño);

    document.getElementById('setInput').value = seleccionados.join(', ');
  }

  function procesarYAnalizar() {
    const A = obtenerConjuntoA();

    if (A.length === 0) {
      alert("Por favor, ingresa al menos un elemento para el conjunto A.");
      return;
    }

    // 1. Calcular el Producto Cartesiano A x A
    const AxA = [];
    for (let x of A) {
      for (let y of A) {
        AxA.push([x, y]);
      }
    }

    // 2. Generar una relación R aleatoria sobre A x A
    const R = AxA.filter(() => Math.random() < 0.5);

    // Mostrar el conjunto A y R en la pantalla
    document.getElementById('setDisplay').innerText = `Conjunto A = { ${A.join(', ')} } ( |A| = ${A.length} )`;
    
    const rString = R.length === 0 
      ? "R = ∅ (Relación vacía)" 
      : "R = { " + R.map(pair => `(${pair[0]}, ${pair[1]})`).join(', ') + " }";
    
    document.getElementById('relationDisplay').innerText = rString;

    // 3. Determinar si es Reflexiva
    // Para todo x en A, (x, x) debe estar en R
    const missingReflexive = A.filter(x => !R.some(pair => pair[0] === x && pair[1] === x));
    const esReflexiva = missingReflexive.length === 0;

    // 4. Determinar si es Simétrica
    // Para todo (x, y) en R, debe existir (y, x) en R
    const missingSymmetric = [];
    for (let [x, y] of R) {
      const tieneInverso = R.some(pair => pair[0] === y && pair[1] === x);
      if (!tieneInverso) {
        missingSymmetric.push(`(${x}, ${y}) está en R, pero (${y}, ${x}) NO`);
      }
    }
    const esSimetrica = missingSymmetric.length === 0;

    // 5. Renderizar los resultados de la evaluación
    const refDiv = document.getElementById('reflexiveResult');
    if (esReflexiva) {
      refDiv.className = "property true";
      refDiv.innerHTML = `<strong>✓ Es Reflexiva:</strong> Contiene a todos los pares (x,x): ${A.map(x => `(${x},${x})`).join(', ')}.`;
    } else {
      refDiv.className = "property false";
      refDiv.innerHTML = `<strong>✗ NO es Reflexiva:</strong> Falta(n) el/los par(es) diagonal(es): ${missingReflexive.map(x => `(${x},${x})`).join(', ')}.`;
    }

    const simDiv = document.getElementById('symmetricResult');
    if (esSimetrica) {
      simDiv.className = "property true";
      simDiv.innerHTML = "<strong>✓ Es Simétrica:</strong> Para todo par (x,y) presente en R, su par inverso (y,x) también pertenece a R.";
    } else {
      simDiv.className = "property false";
      simDiv.innerHTML = `<strong>✗ NO es Simétrica:</strong> ${missingSymmetric[0]}.`;
    }

    document.getElementById('resultBox').style.display = 'block';
  }
</script>

</body>
</html>
